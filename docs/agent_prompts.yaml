              "response_time_minutes": 55,
              "efficiency_score": 12
            },
            "resource_usage": {
              "boat": {
                "allocated": 2,
                "used": 2,
                "utilization_percentage": 100
              }
            },
            "issues_flagged": [
              "CRITICAL: Only 35% coverage (70/200 rescued)",
              "Response time 55 min exceeds 5-min SLA by 1000%",
              "130 people still unaccounted for - URGENT additional resources needed"
            ],
            "audit_trail": "CRISIS_002: Partial rescue completed. 70/200 people rescued (35% coverage). Response time 55 minutes (failed SLA). 2 boats fully utilized but insufficient for scale. 130 people remain at risk.",
            "recommendations": [
              "URGENT: Deploy 3 additional boats immediately",
              "Escalate to regional disaster management",
